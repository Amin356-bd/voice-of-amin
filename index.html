<!-- GitHub Pages রাউটিং: ঠিকানা থেকে base path বের করে এবং 404.html-এর রিডাইরেক্ট ঠিক করে। এটি সবার আগে চলতে হবে। -->
<script>
(function () {
  var l = window.location;
  var keep = /\.github\.io$/i.test(l.hostname) ? 1 : 0;      // project site (…github.io/voice-of-amin/) হলে ১
  var base = l.pathname.split('/').slice(0, 1 + keep).join('/') + '/';
  if (l.search.charAt(1) === '/') {
    var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
    window.history.replaceState(null, '', base.slice(0, -1) + decoded + l.hash);
  }
  window.__VOA_BASE = base;
  document.write('<base href="' + base + '">');
})();
</script>
